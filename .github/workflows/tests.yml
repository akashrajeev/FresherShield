name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests use hand-written SerpApi-shaped payloads: no key, no network, no credits.
      - run: pytest -v
        env:
          FS_OFFLINE: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t freshershield .
      # Smoke test: the container starts without a key (offline mode) and serves the UI and API.
      - run: |
          docker run -d --name fs -p 8000:8000 freshershield
          for i in $(seq 1 30); do curl -fs localhost:8000/api/status && break; sleep 1; done
          curl -fs localhost:8000/api/status | grep -q '"offline":true'
          curl -fs localhost:8000/ | grep -q FresherShield
          docker logs fs
